name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Headless smoke test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4
      - name: Run project for 600 frames and fail on script errors
        run: |
          godot --headless --path . --quit-after 600 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error" run.log; then
            echo "Script errors found"
            exit 1
          fi

  build:
    name: Export debug APK
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4
      - name: Create debug signing key
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/StreetLegends3D.apk
